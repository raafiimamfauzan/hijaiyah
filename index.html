<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Hijaiyah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
:root{
  --bg:#f7f7f4; --surface:#ffffff; --ink:#1d2421; --muted:#68726d; --line:#e2e4df; --accent:#1f6f5c; --accent-ink:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141816;--surface:#1c211f;--ink:#eceeea;--muted:#9aa49e;--line:#2c3330;--accent:#5fc2a6;--accent-ink:#0f1512}
}
:root[data-theme="dark"]{--bg:#141816;--surface:#1c211f;--ink:#eceeea;--muted:#9aa49e;--line:#2c3330;--accent:#5fc2a6;--accent-ink:#0f1512}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.page{max-width:560px;margin:0 auto;padding:28px 20px 48px}
.view{display:none}.view.on{display:block}
h1{font-size:clamp(28px,6vw,34px);margin:8px 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px}
.menu{display:grid;gap:12px}
.menu button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.menu button:hover{border-color:var(--accent)}
.menu strong{display:block;font-size:18px}
.menu span{color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.back:hover{color:var(--ink)}
.title{font-weight:700}
.card{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;padding:24px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;font:inherit}
button.card{cursor:pointer}
.arabic{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:clamp(120px,30vw,170px);line-height:1.5;direction:rtl}
.name{font-size:28px;font-weight:700;margin-top:4px}
.latin{font-size:18px;color:var(--muted);margin-top:2px}
.tap{color:var(--muted);font-size:14px;margin-top:10px}
.reveal{display:none;text-align:center}
.card.open .reveal{display:block}.card.open .tap{display:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:"Noto Naskh Arabic",serif;font-size:24px}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.setting{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.setting label{color:var(--muted);font-size:14px;white-space:nowrap}
select{flex:1;min-width:0;padding:11px 12px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main class="page">

<section class="view" id="v-home">
  <h1>Kartu Hijaiyah</h1>
  <p class="lead">Pilih cara belajar.</p>
  <div class="menu">
    <button type="button" data-go="pengenalan"><strong>Pengenalan</strong><span>Kenali huruf hijaiyah beserta nama dan transliterasinya.</span></button>
    <button type="button" data-go="flashcard"><strong>Flashcard hafalan</strong><span>Uji hafalan huruf secara acak, dengan batas huruf yang bisa diatur.</span></button>
  </div>
</section>

<section class="view" id="v-pengenalan">
  <div class="top"><button class="back" type="button" data-go="home">← Beranda</button><span class="title">Pengenalan</span><span style="width:70px"></span></div>
  <div class="card" aria-live="polite">
    <span class="arabic" id="pArabic" lang="ar"></span>
    <span class="name" id="pName"></span>
    <span class="latin" id="pLatin"></span>
  </div>
  <div class="row">
    <button class="btn" id="pPrev" type="button">Sebelumnya</button>
    <button class="btn" id="pSound" type="button">Dengarkan</button>
    <button class="btn primary" id="pNext" type="button">Berikutnya</button>
  </div>
  <p class="count" id="pCount"></p>
  <div class="grid" id="pGrid"></div>
</section>

<section class="view" id="v-flashcard">
  <div class="top"><button class="back" type="button" data-go="home">← Beranda</button><span class="title">Flashcard hafalan</span><span style="width:70px"></span></div>
  <div class="setting">
    <label for="limit">Hafalan sampai huruf</label>
    <select id="limit"></select>
  </div>
  <button class="card" id="fCard" type="button" aria-label="Ketuk kartu untuk melihat jawaban">
    <span class="arabic" id="fArabic" lang="ar"></span>
    <span class="tap">Ketuk kartu untuk melihat jawaban</span>
    <span class="reveal"><span class="name" id="fName" style="display:block"></span><span class="latin" id="fLatin" style="display:block"></span></span>
  </button>
  <div class="row"><button class="btn primary" id="fShuffle" type="button">Acak</button></div>
</section>

</main>

<script>
const letters = [
  {c:"ا",n:"Alif",l:"A"},{c:"ب",n:"Ba",l:"Ba"},{c:"ت",n:"Ta",l:"Ta"},{c:"ث",n:"Tsa",l:"Tsa"},
  {c:"ج",n:"Jim",l:"Ja"},{c:"ح",n:"Ha",l:"Ha"},{c:"خ",n:"Kha",l:"Kha"},{c:"د",n:"Dal",l:"Da"},
  {c:"ذ",n:"Dzal",l:"Dza"},{c:"ر",n:"Ra",l:"Ra"},{c:"ز",n:"Zai",l:"Za"},{c:"س",n:"Sin",l:"Sa"},
  {c:"ش",n:"Syin",l:"Sya"},{c:"ص",n:"Shad",l:"Sha"},{c:"ض",n:"Dhad",l:"Dha"},{c:"ط",n:"Tha",l:"Tha"},
  {c:"ظ",n:"Zha",l:"Zha"},{c:"ع",n:"’Ain",l:"’A"},{c:"غ",n:"Ghain",l:"Gha"},{c:"ف",n:"Fa",l:"Fa"},
  {c:"ق",n:"Qaf",l:"Qa"},{c:"ك",n:"Kaf",l:"Ka"},{c:"ل",n:"Lam",l:"La"},{c:"م",n:"Mim",l:"Ma"},
  {c:"ن",n:"Nun",l:"Na"},{c:"و",n:"Wau",l:"Wa"},{c:"ه",n:"Ha",l:"Ha"},{c:"ء",n:"Hamzah",l:"’"},
  {c:"ي",n:"Ya",l:"Ya"}
];
const $ = id => document.getElementById(id);
const views = ["home","pengenalan","flashcard"];

function show(name){
  if(!views.includes(name)) name = "home";
  views.forEach(v => $("v-"+v).classList.toggle("on", v===name));
  window.scrollTo(0,0);
}
function go(name){ location.hash = name === "home" ? "" : name; }
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

/* Pengenalan */
let p = 0;
function renderP(){
  const t = letters[p];
  $("pArabic").textContent = t.c; $("pName").textContent = t.n; $("pLatin").textContent = t.l;
  $("pCount").textContent = `Huruf ${p+1} dari ${letters.length}`;
  document.querySelectorAll("#pGrid .chip").forEach((el,i) => el.classList.toggle("on", i===p));
}
function setP(i){ p = (i + letters.length) % letters.length; renderP(); }
letters.forEach((t,i) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = t.c; b.lang = "ar";
  b.setAttribute("aria-label", "Huruf " + t.n);
  b.addEventListener("click", () => setP(i));
  $("pGrid").appendChild(b);
});
$("pPrev").addEventListener("click", () => setP(p-1));
$("pNext").addEventListener("click", () => setP(p+1));
$("pSound").addEventListener("click", () => {
  if(!("speechSynthesis" in window)){ alert("Browser ini belum mendukung suara."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(letters[p].n);
  u.lang = "ar-SA"; u.rate = .75;
  speechSynthesis.speak(u);
});

/* Flashcard */
let f = 0, limit = letters.length;
try { const s = parseInt(localStorage.getItem("hijaiyah-limit"),10); if(s>=1 && s<=letters.length) limit = s; } catch(e){}
letters.forEach((t,i) => {
  const o = document.createElement("option");
  o.value = i+1; o.textContent = `${i+1}. ${t.n} (${t.c})`;
  $("limit").appendChild(o);
});
$("limit").value = limit;

function renderF(){
  const t = letters[f];
  $("fArabic").textContent = t.c; $("fName").textContent = t.n; $("fLatin").textContent = t.l;
  $("fCard").classList.remove("open");
}
function shuffleF(){
  let n = f;
  if(limit > 1) while(n === f) n = Math.floor(Math.random()*limit);
  else n = 0;
  f = n; renderF();
}
$("fCard").addEventListener("click", () => $("fCard").classList.toggle("open"));
$("fShuffle").addEventListener("click", shuffleF);
$("limit").addEventListener("change", e => {
  limit = parseInt(e.target.value,10);
  try { localStorage.setItem("hijaiyah-limit", String(limit)); } catch(err){}
  f = -1; shuffleF();
});

renderP();
f = Math.floor(Math.random()*limit); renderF();
show(location.hash.slice(1));
</script>
</body>
</html>
